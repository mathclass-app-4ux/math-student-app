<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr:kzafey</title><link rel="stylesheet" href="style.css"></head><body>
<header>Mr:kzafey</header><main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');let token=localStorage.t,tab='solve',D=null,ME=null;
const leg0=localStorage.d||'';const dev=(window.Android&&Android.devId&&String(Android.devId()||'').replace(/[^\w-]/g,'').slice(0,40))||localStorage.d||(localStorage.d=Math.random().toString(36).slice(2));const leg=leg0&&leg0!==dev?leg0:'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});
const rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
// shrink big photos before upload
async function small(file,max=1400,ql=.85){const url=await rd(file);return new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',ql))};i.onerror=()=>r(null);i.src=url})}
async function chooser(){let st={};try{st=await (await fetch('/api/status',{cache:'no-store'})).json()}catch(e){}app.innerHTML=(st.closed?'<div class=warn>التطبيق مقفول حالياً. حاول لاحقاً.</div>':'')+`<div class=card><h3>تسجيل الدخول</h3><button class=big onclick="stuLogin()">دخول كطالب</button>${st.open&&!st.closed?'<button class="big sec" onclick="goGuest()">تسجيل جديد بدون كود</button>':''}<button class="big sec" onclick="admLogin()">دخول كمشرف</button></div>`}
function stuLogin(m){app.innerHTML=`<div class=card><h3>دخول كطالب</h3><input id=c placeholder="CODE" style="direction:ltr;text-transform:uppercase"><button onclick=goStu()>دخول</button> <button class=sec onclick=chooser()>رجوع</button><p style=color:#dc2626>${m||''}</p></div>`}
function admLogin(m){app.innerHTML=`<div class=card><h3>دخول كمشرف</h3><input id=u placeholder="Username" style="direction:ltr" autocapitalize=off><input id=p type=password placeholder="Password" style="direction:ltr"><button onclick=goAdm()>دخول</button> <button class=sec onclick=chooser()>رجوع</button><p style=color:#dc2626>${m||''}</p></div>`}
function cpCode(c){try{const t=document.createElement('textarea');t.value=c;t.style.position='fixed';t.style.opacity=0;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();if(navigator.clipboard)navigator.clipboard.writeText(c).catch(()=>{})}catch(e){}alert('تم نسخ الكود: '+c)}
function closedScr(){localStorage.removeItem('cache');app.innerHTML='<div class=card><h3>التطبيق مقفول حالياً</h3><p>حاول مرة تانية لاحقاً.</p><button onclick=start()>إعادة المحاولة</button></div>'}
async function goGuest(){const r=await fetch('/api/signup',{method:'POST',body:JSON.stringify({device:dev,legacy:leg})});const j=await r.json();if(!r.ok)return stuLogin(j.error=='closed'?'التطبيق مقفول حالياً':'التسجيل غير متاح');token=localStorage.t=j.token;localStorage.mycode=j.code;start()}
async function goStu(){const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({role:'student',code:$('#c').value,device:dev,legacy:leg})});const j=await r.json();if(!r.ok)return stuLogin(j.error=='invalid code'?'الكود غير صحيح':j.error=='code already used on another device'?'الكود مستخدم على جهاز آخر':j.error=='code already logged in'?'الكود مسجّل دخول على جهاز آخر. اخرج منه الأول (تسجيل الخروج) أو كلّم المدرس':j.error=='closed'?'التطبيق مقفول حالياً':j.error);token=localStorage.t=j.token;start()}
async function goAdm(){const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({role:'admin',username:$('#u').value,password:$('#p').value})});const j=await r.json();if(!r.ok)return admLogin('بيانات غير صحيحة');localStorage.at=j.token;location.replace('/admin')}
async function start(){try{const r=await fetch('/api/me',{headers:H()});if(r.status==423)return closedScr();if(!r.ok){localStorage.removeItem('t');return chooser()}ME=await r.json();localStorage.me=JSON.stringify(ME)}catch(e){if(!localStorage.cache)return chooser();ME=JSON.parse(localStorage.me||'{}');return load()}
 if(ME.role!=='student'){localStorage.removeItem('t');return chooser()}
 ME.registered?load():reg()}
function reg(m){app.innerHTML=`<div class=card><h3>بياناتك</h3>${localStorage.mycode?'<div class=warn>كودك الخاص: <b class=num style="user-select:text;font-size:20px">'+localStorage.mycode+'</b><br>احتفظ بيه، تدخل بيه من أي موبايل بعد ما تخرج من الأول.</div>':''}<input id=n placeholder="الاسم"><input id=ph type=tel placeholder="رقم الموبايل" style="direction:ltr"><label>صورتك (اختياري)</label><input id=pi type=file accept="image/*"><button onclick=doReg()>حفظ</button><p style=color:#dc2626>${m||''}</p></div>`}
async function doReg(){const f=$('#pi').files[0];const photo=f?await small(f,600):null;const r=await fetch('/api/register',{method:'POST',headers:H(),body:JSON.stringify({name:$('#n').value,phone:$('#ph').value,photo})});if(!r.ok)return reg('اكتب الاسم ورقم موبايل صحيح');const j=await r.json().catch(()=>({}));if(j.token){token=localStorage.t=j.token;localStorage.mycode=j.code}start()}
async function load(){let off=false;try{const r=await fetch('/api/content',{headers:H()});if(r.status==423)return closedScr();if(!r.ok){localStorage.removeItem('t');return chooser()}D=await r.json();localStorage.cache=JSON.stringify(D);try{if(window.Android&&Android.setSecure)Android.setSecure(D.secure!==false)}catch(e){}wm(D.secure===false);try{let e=document.getElementById('scs');if(D.secure===false&&window.Android&&Android.scStatus){if(!e){e=document.createElement('div');e.id='scs';e.style.cssText='position:fixed;left:6px;bottom:2px;font-size:9px;color:#94a3b8;z-index:5;pointer-events:none';document.body.appendChild(e)}e.textContent='sc: '+Android.scStatus()}else if(e)e.remove()}catch(x){}}catch(e){D=JSON.parse(localStorage.cache||'null');off=true;if(!D)return chooser()}
 render(off)}
const TABS=[['solve','حل مسألة'],['t','وسائل التواصل'],['g','درجاتي'],['top','الأوائل'],['news','إعلانات'],['q','أسئلة وحلول']];
let _k=null,_arm=0,_rs=false,_first=null,_apply=null;
function navToast(m){let t=document.getElementById('navt');if(!t){t=document.createElement('div');t.id='navt';t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 18px;border-radius:20px;z-index:99;font-size:14px';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}
function navPush(key,st){if(_rs){_rs=false;_k=key;return}if(_k===null){history.replaceState({root:1},'');history.pushState(st,'');_k=key;_first=st;return}if(key!==_k){history.pushState(st,'');_k=key}}
window.addEventListener('popstate',e=>{const s=e.state;if(!s||s.root){if(_arm&&Date.now()-_arm<2500){_arm=0;history.back();return}_arm=Date.now();navToast('اضغط رجوع مرة تانية للخروج');if(_first){history.pushState(_first,'');_rs=true;_apply&&_apply(_first)}return}_arm=0;_rs=true;_apply&&_apply(s)});
_apply=s=>{tab=s.tab;render(window._off)};
function render(off){window._off=off;navPush(tab,{tab});let h=(off?'<div class=warn>لا يوجد إنترنت. بتشوف آخر محتوى محفوظ.</div>':'')+'<div class=tabs>'+TABS.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="tab='${x[0]}';render(${!!off})">${x[1]}</button>`).join('')+'</div><div id=pane></div>';app.innerHTML=h;pane(off)}
function pane(off){const p=$('#pane');
 if(tab=='solve'){p.innerHTML=`<div class=sv><div class=svh><div class=svi>🧮</div><div><b>حل المسائل</b><small>اكتب المسألة أو صوّرها، وهتاخد الحل المباشر والشرح</small></div></div>
<textarea id=st class=svt rows=4 placeholder="اكتب المسألة هنا" dir=auto></textarea>
<div class=svp id=sp hidden><img id=spi><button class=svx onclick="clrImg()">✕</button></div>
<div class=svrow><label class=pick>📷 صوّر المسألة<input id=sc type=file accept="image/*" capture=environment hidden onchange="pickImg(this)"></label><label class=pick>🖼️ من المعرض<input id=sg type=file accept="image/*" hidden onchange="pickImg(this)"></label></div>
<button class=go id=sb onclick=solve()>${off?'محتاج إنترنت':'✨ احسب الحل'}</button><div id=sr></div>
<div class=svn>الحل بيتعمل بالذكاء الاصطناعي، راجعه مع المدرس لو مش متأكد.</div></div>`}
 if(tab=='top'){if(!D.top.length)p.innerHTML='<p>لا يوجد محتوى بعد</p>';else if(!window.MathApp&&!/MathAppAPK/.test(navigator.userAgent))p.innerHTML='<div class=card>صور الأوائل بتتفتح من تطبيق الأندرويد بس.</div>';else{p.innerHTML=D.top.slice().reverse().map(x=>`<div class="ig nosave"><div class=igh><span class=iga>🏆</span>${(x.adminName||D.adminName)?`<div><b class=an>${esc(x.adminName||D.adminName)}</b><br><small>${esc(x.title)}</small></div>`:`<b>${esc(x.title)}</b>`}</div><div id="tp${x.id}" class=igi></div><div class=igb><button class=bry id="lk${x.id}" onclick="like('${x.id}')"><span class="ylk${x.liked?' on':''}">Y</span></button><button class=lcnt id="lc${x.id}" onclick="showLikers('${x.id}')">${x.likes}</button></div><p class=igc>${esc(x.text)}</p></div>`).join('');D.top.forEach(x=>{for(let i=0;i<x.count;i++)topImg(x.id,i)})}}

 if(tab=='g'){p.innerHTML='<div class=card>جاري التحميل...</div>';fetch('/api/my-grades',{headers:H()}).then(r=>r.json()).then(j=>{p.innerHTML=!j.linked?'<div class=card>لسه مفيش درجات مربوطة بكودك. لما الأستاذ يضيف درجاتك هتظهر هنا.</div>':`<div class=card><b>${esc(j.name)}</b><br><small>${esc(j.group)}</small></div>`+(j.grades.length?j.grades.map(x=>`<div class=card style="display:flex;justify-content:space-between;align-items:center"><div><b>${esc(x.title)}</b><br><small class=num>${new Date(x.date).toLocaleDateString('en-GB')}</small></div><b class="an num" style="font-size:22px">${esc(x.score)}${x.max?' / '+esc(x.max):''}</b></div>`).join(''):'<div class=card>لا توجد درجات بعد.</div>')}).catch(()=>{p.innerHTML='<div class=card>محتاج إنترنت عشان تشوف درجاتك.</div>'})}
 if(tab=='news')p.innerHTML=D.posts.map(x=>`<div class=card><b>${esc(x.title)}</b><p>${esc(x.text)}</p>${x.images.map(i=>`<span class=nw><img src="${i}"></span>`).join('')}</div>`).join('')||'<p>لا يوجد إعلانات</p>';
 if(tab=='q')p.innerHTML=D.questions.map((x,i)=>`<div class=card><small>${esc(x.subject)}</small><div class=num><b>${esc(x.question)}</b></div><button class=sec onclick="t('d${i}')">الحل المباشر</button> <button class=sec onclick="t('e${i}')">الحل بالشرح</button><div id=d${i} class="sol num" hidden>${esc(x.direct)}</div><div id=e${i} class=ex hidden>${esc(x.explained)}</div></div>`).join('')||'<p>لا توجد أسئلة بعد</p>';
 if(tab=='t')p.innerHTML=`<div class="card links"><b>تواصل مع الأستاذ</b><a class=big style="background:#25d366" href="${D.links.whatsapp}">WhatsApp</a>${D.links.facebook.map(l=>`<a class=big style="background:#1877f2" href="${l.url}">Facebook: ${l.name}</a>`).join('')}<a class=big style="background:linear-gradient(135deg,#7c3aed,#ec4899)" href="tel:${D.links.phone}">اتصال <span class=num>${D.links.phone}</span></a></div>${ME&&ME.code?`<div class=card><b>كودك الخاص</b><div class=num style="font-size:24px;font-weight:700;letter-spacing:3px;margin:8px 0;user-select:text">${ME.code}</div><button onclick="cpCode('${ME.code}')">نسخ الكود</button></div>`:''}<button class=sec onclick="fetch('/api/logout',{method:'POST',headers:H()}).finally(()=>{['t','me','cache'].forEach(k=>localStorage.removeItem(k));location.reload()})">تسجيل الخروج</button>`}
function t(i){const e=document.getElementById(i);e.hidden=!e.hidden}
function showLikers(id){const x=D.top.find(y=>y.id==id)||{};const L=x.likers||[];const o=document.createElement('div');o.className='lsh';o.onclick=e=>{if(e.target===o)o.remove()};
 o.innerHTML='<div class=lbox><div class=lhd><b>التفاعلات ('+(x.likes||0)+')</b><button class=lx onclick="this.closest(\'.lsh\').remove()">✕</button></div>'+(L.length?L.slice().reverse().map(n=>'<div class=lrow><span class=lav>'+esc(n[0]||'?')+'</span>'+esc(n)+'</div>').join(''):'<p style=text-align:center;color:#64748b>لسه محدش تفاعل</p>')+'</div>';document.body.appendChild(o)}
async function like(id){try{const r=await fetch('/api/like',{method:'POST',headers:H(),body:JSON.stringify({id})});if(!r.ok)return;const j=await r.json();document.getElementById('lk'+id).innerHTML='<span class="ylk'+(j.liked?' on':'')+'">Y</span>';document.getElementById('lc'+id).textContent=j.likes;const x=D.top.find(y=>y.id==id);if(x){x.liked=j.liked;x.likes=j.likes;x.likers=j.likers;localStorage.cache=JSON.stringify(D)}}catch(e){}}
async function topImg(id,i){try{const r=await fetch('/api/top-image?id='+id+'&i='+i,{headers:H()});if(!r.ok)return;const b=await r.blob(),im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);const w=((ME&&ME.name)||'')+' '+((ME&&ME.phone)||''),s=Math.max(11,im.width/40);x.font='bold '+s+'px sans-serif';x.textAlign='right';x.textBaseline='bottom';x.lineWidth=Math.max(1,s/10);x.strokeStyle='rgba(0,0,0,.18)';x.fillStyle='rgba(255,255,255,.28)';x.strokeText(w,im.width-s*.6,im.height-s*.5);x.fillText(w,im.width-s*.6,im.height-s*.5);c.oncontextmenu=e=>e.preventDefault();c.className='nosave';document.getElementById('tp'+id).appendChild(c);URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(b)}catch(e){}}
let SF=null;
function pickImg(inp){const f=inp.files[0];if(!f)return;SF=f;$('#spi').src=URL.createObjectURL(f);$('#sp').hidden=false}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&token&&window.Android&&Android.setSecure)fetch('/api/content',{headers:H()}).then(r=>r.ok?r.json():null).then(d=>{if(d){Android.setSecure(d.secure!==false);wm(d.secure===false)}}).catch(()=>{})});
function clrImg(){SF=null;$('#sp').hidden=true;$('#sc').value='';$('#sg').value=''}
function svTab(k){['d','e'].forEach(x=>{$('#sv'+x).hidden=x!=k;$('#st'+x).classList.toggle('on',x==k)})}
const _G={alpha:'α',beta:'β',gamma:'γ',delta:'δ',theta:'θ',lambda:'λ',mu:'μ',sigma:'σ',omega:'ω',phi:'φ',pi:'π',Delta:'Δ',Sigma:'Σ',Omega:'Ω',therefore:'∴',because:'∵',angle:'∠',measuredangle:'∠',triangle:'△',parallel:'∥',perp:'⊥',times:'×',div:'÷',cdot:'·',pm:'±',mp:'∓',leq:'≤',le:'≤',geq:'≥',ge:'≥',neq:'≠',ne:'≠',approx:'≈',equiv:'≡',sim:'∼',cong:'≅',infty:'∞',in:'∈',notin:'∉',subset:'⊂',cup:'∪',cap:'∩',Rightarrow:'⇒',rightarrow:'→',to:'→',Leftrightarrow:'⇔',leftrightarrow:'↔',degree:'°',circ:'°',sum:'∑',int:'∫',forall:'∀',exists:'∃',ldots:'…',dots:'…',overline:'',widehat:'',hat:'',vec:''};
const _SU={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','n':'ⁿ','+':'⁺','-':'⁻'},_SB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
function mth(t){t=String(t==null?'':t);if(!/[\\$^_{}*]/.test(t))return t;
 t=t.replace(/\$\$?/g,'').replace(/\\[\(\)\[\]]/g,'').replace(/\\(left|right|displaystyle|,|;|!|quad|qquad)/g,' ');
 for(let k=0;k<4;k++){t=t.replace(/\\text\{([^{}]*)\}/g,'$1').replace(/\\(?:mathrm|mathbf|textbf|operatorname)\{([^{}]*)\}/g,'$1').replace(/\\d?frac\{([^{}]*)\}\{([^{}]*)\}/g,(m,a,b)=>(/^(\d+(\.\d+)?|[A-Za-z])$/.test(a)?a:'('+a+')')+'/'+(/^(\d+(\.\d+)?|[A-Za-z])$/.test(b)?b:'('+b+')')).replace(/\\sqrt\[(\d+)\]\{([^{}]*)\}/g,(m,n,a)=>(_SU[n]||'')+'√('+a+')').replace(/\\sqrt\{([^{}]*)\}/g,(m,a)=>/^[\w.]+$/.test(a)?'√'+a:'√('+a+')')}
 t=t.replace(/\\([A-Za-z]+)/g,(m,n)=>n in _G?_G[n]:m).replace(/\^\{?\\?(?:circ|°)\}?/g,'°');
 t=t.replace(/\^\{([^{}]*)\}/g,(m,a)=>[...a].every(c=>c in _SU)?[...a].map(c=>_SU[c]).join(''):'^('+a+')').replace(/\^([0-9n])/g,(m,a)=>_SU[a]).replace(/_\{([0-9]+)\}/g,(m,a)=>[...a].map(c=>_SB[c]).join('')).replace(/_([0-9])/g,(m,a)=>_SB[a]);
 return t.replace(/[{}]/g,'').replace(/\*\*/g,'')}
async function fx(u,o,ms){const c=new AbortController,t=setTimeout(()=>c.abort(),ms||100000);try{return await fetch(u,{...o,signal:c.signal})}finally{clearTimeout(t)}}
async function getDet(){if(!SF)return null;if(window._detF!==SF){window._det=await small(SF,1000,.7);window._detF=SF}return window._det}
function aiMsg(j){return j.error=='ai_busy'?'<div class=warn>الذكاء الاصطناعي مشغول دلوقتي. استنى دقيقة وجرب تاني.</div>':j.error=='ai_timeout'?'<div class=warn>الرد اتأخر. جرب تاني.</div>':'<div class=warn>حصلت مشكلة، حاول تاني.</div>'}
async function getImg(){if(!SF)return null;if(window._imgF!==SF){window._img=await small(SF,1600,.8);window._imgF=SF}return window._img}
function showRes(o,j){o.innerHTML=`<div class=seg><button id=std class=on onclick="svTab('d')">الحل المباشر</button><button id=ste onclick="svTab('e')">الحل بالشرح</button></div><div id=svd class="res d num">${esc(mth(j.direct))}</div><div id=sve class="res e" hidden>${esc(mth(j.explained))}</div>${j.truncated?'<div class=warn>المسألة طويلة جداً والحل اتقطع. جرب تحل جزء جزء (صوّر الجزء اللي عايزه بس).</div>':''}`}
async function solve(){const o=$('#sr'),btn=$('#sb');if(!$('#st').value.trim()&&!SF){o.innerHTML='<div class=warn>اكتب المسألة أو صورها الأول.</div>';return}
 btn.disabled=true;
 if(SF&&!$('#st').value.trim()){o.innerHTML='<div class=load><span class=spin></span>جاري قراءة الصورة (1/2)... لو اتأخرت هنحل مباشرة</div>';
  try{const image=await getDet();const r=await fx('/api/solve',{method:'POST',headers:H(),body:JSON.stringify({detect:true,image})},35000);
   if(r.ok){const j=await r.json();if((j.problems||[]).length>1){btn.disabled=false;window.PR=j.problems;
     o.innerHTML='<div class=card><b>لقيت '+j.problems.length+' مسائل في الصورة. اختار المسألة اللي عايز تحلها:</b>'+j.problems.map((p,k)=>`<button class="sec prob" onclick="doSolve(${k})"><b class=num>${p.n}</b> ${esc(String(p.text).slice(0,110))}</button>`).join('')+'<p><small>لو المسألة مش ظاهرة، اكتب رقمها أو نصها في الخانة فوق واضغط احسب.</small></p></div>';return}}
   else if(r.status==429)return o.innerHTML='<div class=warn>وصلت للحد اليومي. جرب بكرة.</div>',btn.disabled=false}catch(e){}
 }
 doSolve(-1)}
async function doSolve(k){const o=$('#sr'),btn=$('#sb');const pick=k>=0&&window.PR?window.PR[k]:null;
 btn.disabled=true;o.innerHTML='<div class=load><span class=spin></span>جاري الحل'+(SF&&!$('#st').value.trim()&&!pick?' (2/2)':'')+'... ممكن ياخد من 10 ل 60 ثانية'+(pick?' (مسألة '+pick.n+')':'')+'</div>';
 try{const image=await getImg();
 const r=await fx('/api/solve',{method:'POST',headers:H(),body:JSON.stringify({text:$('#st').value,image,pick:pick?{n:pick.n,text:pick.text}:undefined})});const j=await r.json();btn.disabled=false;
 if(r.status==429)return o.innerHTML=j.error=='busy'?'<div class=warn>الخدمة مشغولة النهاردة. جرب بعد شوية أو بكرة.</div>':'<div class=warn>وصلت للحد اليومي للحلول. جرب بكرة.</div>';
 if(j.error=='ai_not_configured')return o.innerHTML='<div class=warn>الحل الذكي لسه مش متفعل.</div>';
