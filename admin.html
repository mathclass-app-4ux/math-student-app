<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header>لوحة التحكم (المشرف)</header><main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');let token=localStorage.at;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(p,b)=>fetch('/api/'+p,{method:b?'POST':'GET',headers:{Authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
function login(){app.innerHTML='<div class=card><input id=u placeholder="Username" style="direction:ltr" autocapitalize=off><input id=pw type=password placeholder="Password" style="direction:ltr"><button onclick=go()>دخول</button> <a href="/">رجوع</a></div>'}
async function go(){const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({role:'admin',username:$('#u').value,password:$('#pw').value})});const j=await r.json();if(!r.ok)return alert('بيانات غلط');token=localStorage.at=j.token;show()}
const fd=t=>new Date(t).toLocaleString('en-GB');
async function show(){const codes=await api('codes');if(codes.error)return login();const d=await api('content');const logs=await api('logs');
 app.innerHTML=`<div class=card><h3>إنشاء أكواد</h3><input id=n type=number value=1 min=1 max=200><input id=lb placeholder="ملاحظة (اختياري)"><input id=md type=number value=1 placeholder="عدد الأجهزة"><button onclick=mk()>إنشاء</button></div>
 <div class=card><h3>الأكواد والطلاب (${codes.length})</h3><table>${codes.map(c=>`<tr><td class=num><b>${c.code}</b></td><td>${c.student?esc(c.student.name)+'<br><span class=num>'+esc(c.student.phone)+'</span>'+(c.student.hasPhoto?` <a href="#" onclick="ph('${c.code}');return false">صورة</a>`:''):'<small>لم يسجل بعد</small>'}</td><td>${c.devices.length}/${c.maxDevices}</td><td><button class=sec onclick="tg('${c.code}')">${c.disabled?'تفعيل':'إيقاف'}</button> <button class=red onclick="dl('codes/delete','code','${c.code}')">حذف</button></td></tr>`).join('')}</table></div>
 <div class=card><h3>نشر</h3><select id=pk style="width:100%;padding:10px"><option value=top>صور الأوائل (محمية، من التطبيق فقط)</option><option value=news>إعلان عام</option></select><input id=pt placeholder="العنوان"><textarea id=px placeholder="نص"></textarea><input id=pi type=file accept="image/*" multiple><button onclick=post()>نشر لكل الطلاب</button><div id=pm></div>${d.top.concat(d.posts).map(p=>`<p>${p.kind=='top'?'🏆':'📢'} ${esc(p.title)} <small>(${p.count} صورة)</small> <button class=red onclick="dl('posts/delete','id','${p.id}')">حذف</button><br><span class=thumbs data-id="${p.id}" data-n="${p.count}" data-k="${p.kind}"></span></p>`).join('')}</div>
 <div class=card><h3>حماية الصور</h3><p>${d.secure!==false?'الوضع الحالي: منع التصوير (السكرين شوت بيطلع أسود ومش بيتسجل)':'الوضع الحالي: تسجيل المحاولات (السكرين شوت مسموح وبيتسجل مين صوّر، أندرويد 14+)'}</p><button onclick="api('settings',{secure:${d.secure===false}}).then(show)">${d.secure!==false?'غيّر لوضع تسجيل المحاولات':'غيّر لوضع منع التصوير'}</button></div>
 <div class=card><h3>محاولات تصوير الشاشة (${logs.length})</h3>${logs.map(l=>`<p>${fd(l.date)}: ${esc(l.name||l.code)} <span class=num>${esc(l.phone||'')}</span> حاول يصور الشاشة${l.where=='top'?' في صور الأوائل':''}</p>`).join('')||'<p>لا يوجد</p>'}</div>
 <div class=card><h3>سؤال وحل (يدوي)</h3><input id=qs value="الرياضيات"><textarea id=qq placeholder="السؤال"></textarea><textarea id=qd placeholder="الحل المباشر"></textarea><textarea id=qe placeholder="الحل بالشرح"></textarea><button onclick=addq()>إضافة</button>${d.questions.map(p=>`<p>${esc(p.question.slice(0,40))} <button class=red onclick="dl('questions/delete','id','${p.id}')">حذف</button></p>`).join('')}</div>
 <button class=sec onclick="localStorage.removeItem('at');location='/'">خروج</button>`;loadThumbs()}
async function loadThumbs(){for(const s of document.querySelectorAll('.thumbs')){for(let k=0;k<+s.dataset.n;k++){try{const r=await fetch('/api/top-image?id='+s.dataset.id+'&i='+k,{headers:{Authorization:'Bearer '+token}});if(!r.ok)continue;const im=document.createElement('img');im.src=URL.createObjectURL(await r.blob());im.style='width:90px;height:90px;object-fit:cover;margin:2px;border-radius:8px';s.appendChild(im)}catch(e){}}}}
async function mk(){await api('codes',{count:$('#n').value,label:$('#lb').value,maxDevices:$('#md').value});show()}
async function tg(c){await api('codes/toggle',{code:c});show()}
async function dl(p,k,v){if(confirm('متأكد؟')){await api(p,{[k]:v});show()}}
async function ph(c){const r=await fetch('/api/student-photo?code='+c,{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const w=window.open();w.document.write('<img style="max-width:100%" src="'+URL.createObjectURL(await r.blob())+'">')}
const rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
const shrink=(f,max=1600)=>rd(f).then(u=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};i.onerror=()=>r(/^data:image\/(png|jpeg|webp);/.test(u)&&u.length<9e6?u:null);i.src=u}));
const msg=(t,ok)=>{const m=$('#pm');if(m){m.style.cssText='padding:10px;border-radius:8px;margin:8px 0;background:'+(ok?'#dcfce7':'#fee2e2');m.textContent=t}};
async function post(){const fs=[...$('#pi').files];const t=$('#pt').value,x=$('#px').value,k=$('#pk').value;
 if(!fs.length&&!t&&!x)return msg('اختار صورة أو اكتب عنوان الأول');
 msg('جاري تجهيز '+fs.length+' صورة...',1);
 let images=[];try{images=(await Promise.all(fs.map(f=>shrink(f)))).filter(Boolean)}catch(e){return msg('خطأ في قراءة الصورة: '+e)}
 if(fs.length&&!images.length)return msg('الصورة مش مدعومة (غالبا HEIC). اختار صورة JPG أو PNG',0);
 msg('جاري الرفع...',1);
 try{const r=await fetch('/api/posts',{method:'POST',headers:{Authorization:'Bearer '+token},body:JSON.stringify({kind:k,title:t,text:x,images})});const j=await r.json().catch(()=>({}));
  if(!r.ok||j.error){const e=j.error||('HTTP '+r.status);return msg('فشل النشر: '+(e=='admin only'||e=='login required'?'الجلسة انتهت، اخرج وادخل تاني':e=='bad_image'?'السيرفر رفض الصورة':e),0)}
  await show();msg('تم النشر ('+images.length+' صورة) ✅',1)}catch(e){msg('فشل الاتصال بالسيرفر: '+e,0)}}
async function addq(){await api('questions',{subject:$('#qs').value,question:$('#qq').value,direct:$('#qd').value,explained:$('#qe').value});show()}
token?show():login();
</script></body></html>
