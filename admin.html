<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header>لوحة التحكم (المشرف)</header><main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');let token=localStorage.at;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(p,b)=>fetch('/api/'+p,{method:b?'POST':'GET',headers:{Authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
function login(){app.innerHTML='<div class=card><input id=u placeholder="Username" style="direction:ltr" autocapitalize=off><input id=pw type=password placeholder="Password" style="direction:ltr"><button onclick=go()>دخول</button> <a href="/">رجوع</a></div>'}
async function go(){const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({role:'admin',username:$('#u').value,password:$('#pw').value})});const j=await r.json();if(!r.ok)return alert('بيانات غلط');token=localStorage.at=j.token;show()}
const fd=t=>new Date(t).toLocaleString('en-GB');
async function show(){const codes=await api('codes');if(codes.error)return login();const d=await api('content');const logs=await api('logs');
 app.innerHTML=`<div class=card><a href=/manage><button class=big style="background:#059669">📋 الحضور والمصروفات وتقرير ولي الأمر</button></a></div><div class=card><h3>إنشاء أكواد</h3><div id=nc></div><input id=n type=number value=1 min=1 max=200><input id=lb placeholder="ملاحظة (اختياري)"><input id=md type=number value=1 placeholder="عدد الأجهزة"><button onclick=mk()>إنشاء</button></div>
 <div class=card><h3>الأكواد والطلاب (${codes.length})</h3><table>${codes.map(c=>`<tr><td class=num><b style="user-select:text;-webkit-user-select:text;font-size:17px">${c.code}</b> <button class=sec style="padding:4px 10px" onclick="cp('${c.code}')">نسخ</button></td><td>${c.student?esc(c.student.name)+'<br><span class=num>'+esc(c.student.phone)+'</span>'+(c.student.hasPhoto?` <a href="#" onclick="ph('${c.code}');return false">صورة</a>`:''):'<small>لم يسجل بعد</small>'}</td><td>${c.devices.length}/${c.maxDevices}</td><td><button class=sec onclick="tg('${c.code}')">${c.disabled?'تفعيل':'إيقاف'}</button> <button class=red onclick="dl('codes/delete','code','${c.code}')">حذف</button></td></tr>`).join('')}</table></div>
 <div class=card><h3>نشر</h3><select id=pk style="width:100%;padding:10px"><option value=top>صور الأوائل (محمية، من التطبيق فقط)</option><option value=news>إعلان عام</option></select><input id=pt placeholder="العنوان"><textarea id=px placeholder="نص"></textarea><input id=pi type=file accept="image/*" multiple><button id=pb onclick=post()>نشر لكل الطلاب</button><div id=pm></div>${d.top.concat(d.posts).map(p=>`<p>${p.kind=='top'?'🏆':'📢'} ${esc(p.title)} <small>(${p.count} صورة)</small> <button class=red onclick="dl('posts/delete','id','${p.id}')">حذف</button><br><span class=thumbs data-id="${p.id}" data-n="${p.count}" data-k="${p.kind}"></span></p>`).join('')}</div>
 <div class=card><h3>حماية الصور</h3><p>${d.secure!==false?'الوضع الحالي: منع التصوير (السكرين شوت بيطلع أسود ومش بيتسجل)':'الوضع الحالي: تسجيل المحاولات (السكرين شوت مسموح وبيتسجل مين صوّر، أندرويد 14+)'}</p><button onclick="api('settings',{secure:${d.secure===false}}).then(show)">${d.secure!==false?'غيّر لوضع تسجيل المحاولات':'غيّر لوضع منع التصوير'}</button></div>
 <div class=card><h3>محاولات تصوير الشاشة (${logs.length})</h3>${logs.map(l=>`<p>${fd(l.date)}: ${esc(l.name||l.code)} <span class=num>${esc(l.phone||'')}</span> حاول يصور الشاشة${l.where=='top'?' في صور الأوائل':''}</p>`).join('')||'<p>لا يوجد</p>'}</div>
 <div class=card><h3>سؤال وحل (يدوي)</h3><input id=qs value="الرياضيات"><textarea id=qq placeholder="السؤال"></textarea><textarea id=qd placeholder="الحل المباشر"></textarea><textarea id=qe placeholder="الحل بالشرح"></textarea><button onclick=addq()>إضافة</button>${d.questions.map(p=>`<p>${esc(p.question.slice(0,40))} <button class=red onclick="dl('questions/delete','id','${p.id}')">حذف</button></p>`).join('')}</div>
 <button class=sec onclick="localStorage.removeItem('at');location='/'">خروج</button>`;loadThumbs()}
async function loadThumbs(){for(const s of document.querySelectorAll('.thumbs')){for(let k=0;k<+s.dataset.n;k++){try{const r=await fetch('/api/top-image?id='+s.dataset.id+'&i='+k,{headers:{Authorization:'Bearer '+token}});if(!r.ok)continue;const im=document.createElement('img');im.src=URL.createObjectURL(await r.blob());im.style='width:90px;height:90px;object-fit:cover;margin:2px;border-radius:8px';s.appendChild(im)}catch(e){}}}}
function cp(t){const done=()=>{const m=$('#cpm');if(m){m.textContent='تم نسخ: '+t;setTimeout(()=>m.textContent='',2500)}};
 const fb=()=>{const x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(x);x.focus();x.select();try{document.execCommand('copy')}catch(e){}x.remove();done()};
 try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}}
async function mk(){const j=await api('codes',{count:$('#n').value,label:$('#lb').value,maxDevices:$('#md').value});await show();const cs=Array.isArray(j)?j.map(c=>c.code):[];if(cs.length){$('#nc').innerHTML='<div style="background:#dcfce7;border-radius:10px;padding:10px;margin:8px 0"><b>تم إنشاء الكود:</b>'+cs.map(c=>`<div style="display:flex;gap:8px;align-items:center;margin:6px 0"><span class=num style="font-size:22px;font-weight:700;letter-spacing:2px;user-select:text;-webkit-user-select:text">${c}</span><button onclick="cp('${c}')">نسخ</button></div>`).join('')+(cs.length>1?`<button class=sec onclick="cp('${cs.join(' ')}')">نسخ الكل</button>`:'')+'<div id=cpm style="color:#166534;margin-top:4px"></div></div>'}}
async function tg(c){await api('codes/toggle',{code:c});show()}
async function dl(p,k,v){if(confirm('متأكد؟')){await api(p,{[k]:v});show()}}
async function ph(c){const r=await fetch('/api/student-photo?code='+c,{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const w=window.open();w.document.write('<img style="max-width:100%" src="'+URL.createObjectURL(await r.blob())+'">')}
const rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
const TO=(p,ms,what)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error(what+' أخد وقت طويل')),ms))]);
const rdE=f=>new Promise((res,rj)=>{const x=new FileReader;x.onload=()=>res(x.result);x.onerror=()=>rj(new Error('مقدرتش أقرا الملف'));x.readAsDataURL(f)});
async function shrink(f,max=1600){
 try{let w,h,src;
  if(window.createImageBitmap){const bm=await TO(createImageBitmap(f),20000,'فتح الصورة');w=bm.width;h=bm.height;src=bm}
  else{const u=URL.createObjectURL(f);src=await TO(new Promise((res,rj)=>{const i=new Image;i.onload=()=>res(i);i.onerror=()=>rj(new Error('decode'));i.src=u}),20000,'فتح الصورة');w=src.width;h=src.height}
  const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.85)}
 catch(e){ if(/^image\/(png|jpeg|webp)$/.test(f.type)&&f.size<9e6){return await TO(rdE(f),20000,'قراءة الصورة')} return null}}
const msg=(t,ok)=>{const m=$('#pm');if(m){m.style.cssText='padding:10px;border-radius:8px;margin:8px 0;background:'+(ok?'#dcfce7':'#fee2e2');m.textContent=t}};
async function post(){const fs=[...$('#pi').files];const t=$('#pt').value,x=$('#px').value,k=$('#pk').value;
 if(!fs.length&&!t&&!x)return msg('اختار صورة أو اكتب عنوان الأول');
 const b=$('#pb');if(b)b.disabled=true;const done=()=>{if(b)b.disabled=false};
 let images=[];try{for(let n=0;n<fs.length;n++){msg('جاري تجهيز الصورة '+(n+1)+' من '+fs.length+'...',1);const d=await shrink(fs[n]);if(d)images.push(d)}}catch(e){done();return msg('خطأ في تجهيز الصورة: '+e.message,0)}
 if(fs.length&&!images.length){done();return msg('الصورة مش مدعومة (غالبا HEIC). اختار صورة JPG أو PNG',0)}
 const body=JSON.stringify({kind:k,title:t,text:x,images});const mb=(body.length/1048576).toFixed(1);
 for(let tr=1;tr<=2;tr++){
  msg('جاري الرفع ('+mb+' MB)'+(tr>1?' - محاولة تانية':'')+'... السيرفر المجاني ممكن ياخد وقت لو كان نايم',1);
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),70000);
  try{const r=await fetch('/api/posts',{method:'POST',headers:{Authorization:'Bearer '+token},body,signal:ac.signal});clearTimeout(tm);const j=await r.json().catch(()=>({}));
   if(!r.ok||j.error){done();const e=j.error||('HTTP '+r.status);return msg('فشل النشر: '+(e=='admin only'||e=='login required'?'الجلسة انتهت، اخرج وادخل تاني':e=='bad_image'?'السيرفر رفض الصورة':e),0)}
   msg('تم الرفع، جاري التحديث...',1);try{await TO(show(),15000,'تحديث الصفحة')}catch(e){}
   done();return msg('تم النشر ('+images.length+' صورة) ✅',1)}
  catch(e){clearTimeout(tm);if(tr==2){done();return msg('فشل الرفع: '+(e.name=='AbortError'?'انتهى الوقت (النت ضعيف أو السيرفر نايم). جرب تاني':e.message),0)}}}}
async function addq(){await api('questions',{subject:$('#qs').value,question:$('#qq').value,direct:$('#qd').value,explained:$('#qe').value});show()}
token?show():login();
</script></body></html>
