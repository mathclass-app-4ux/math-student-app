<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header>لوحة التحكم (المشرف)</header><main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');let token=localStorage.at;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(p,b)=>fetch('/api/'+p,{method:b?'POST':'GET',headers:{Authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
function login(){app.innerHTML='<div class=card><input id=pw type=password placeholder="Admin password" style="direction:ltr"><button onclick=go()>دخول</button></div>'}
async function go(){const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});const j=await r.json();if(!r.ok)return alert('كلمة السر غلط');token=localStorage.at=j.token;show()}
async function show(){const codes=await api('codes');if(codes.error)return login();const d=await api('content');
 app.innerHTML=`<div class=card><h3>إنشاء أكواد</h3><input id=n type=number value=1 min=1 max=200 placeholder="عدد الأكواد"><input id=lb placeholder="اسم / ملاحظة (اختياري)"><input id=md type=number value=1 placeholder="عدد الأجهزة المسموحة"><button onclick=mk()>إنشاء</button></div>
 <div class=card><h3>الأكواد (${codes.length})</h3><table>${codes.map(c=>`<tr><td class=num><b>${c.code}</b></td><td>${esc(c.label)}</td><td>${c.devices.length}/${c.maxDevices}</td><td><button class=sec onclick="tg('${c.code}')">${c.disabled?'تفعيل':'إيقاف'}</button> <button class=red onclick="dl('codes/delete','code','${c.code}')">حذف</button></td></tr>`).join('')}</table></div>
 <div class=card><h3>نشر صور الأوائل / إعلان</h3><input id=pt placeholder="العنوان"><textarea id=px placeholder="نص"></textarea><input id=pi type=file accept="image/*" multiple><button onclick=post()>نشر لكل الطلاب</button>${d.posts.map(p=>`<p>${esc(p.title)} <button class=red onclick="dl('posts/delete','id','${p.id}')">حذف</button></p>`).join('')}</div>
 <div class=card><h3>إضافة سؤال وحل</h3><input id=qs value="الرياضيات" placeholder="المادة"><textarea id=qq placeholder="السؤال (الأرقام والرموز English)"></textarea><textarea id=qd placeholder="الحل المباشر"></textarea><textarea id=qe placeholder="الحل بالشرح (عربي)"></textarea><button onclick=addq()>إضافة</button>${d.questions.map(p=>`<p>${esc(p.question.slice(0,40))} <button class=red onclick="dl('questions/delete','id','${p.id}')">حذف</button></p>`).join('')}</div>`}
async function mk(){await api('codes',{count:$('#n').value,label:$('#lb').value,maxDevices:$('#md').value});show()}
async function tg(c){await api('codes/toggle',{code:c});show()}
async function dl(p,k,v){if(confirm('متأكد؟')){await api(p,{[k]:v});show()}}
const rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
async function post(){const images=await Promise.all([...$('#pi').files].map(rd));await api('posts',{title:$('#pt').value,text:$('#px').value,images});show()}
async function addq(){await api('questions',{subject:$('#qs').value,question:$('#qq').value,direct:$('#qd').value,explained:$('#qe').value});show()}
token?show():login();
</script></body></html>
