<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr:kzafey</title><link rel="stylesheet" href="style.css">
<style>.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #e2e8f0}.row b{flex:1}.bt{display:flex;gap:6px}.bt button{padding:8px 12px;margin:0;background:#e2e8f0;color:#1b2430}.bt button.p{background:#16a34a;color:#fff}.bt button.a{background:#dc2626;color:#fff}.bt button.wa{background:#25d366;color:#fff}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.stat span{background:#f3e8ff;border-radius:10px;padding:6px 10px;font-weight:700}.tabs button{flex:1}select{font:inherit;padding:10px;border-radius:8px;border:1px solid #cbd5e1;width:100%;margin:4px 0}small{color:#64748b}
main{padding-bottom:84px}.hero{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-radius:24px;padding:22px;margin:6px 0}.hero h2{margin:0 0 10px;font-size:26px}.hero p{margin:0 0 14px;opacity:.95}.hero span{display:inline-block;background:#ffffff33;border-radius:12px;padding:10px 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#fff;border-radius:20px;padding:18px;text-align:center;box-shadow:0 1px 4px #0001}.tile small{display:block;margin-top:4px}.sess{border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin:8px 0}
.bn{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:9}.bn button{flex:1;background:none;color:#475569;border-radius:0;margin:0;padding:8px 2px;font-size:12px;border:0}.bn button span{display:block;font-size:20px}.bn button.on{color:#7c3aed;font-weight:700}
.hd{font-size:22px;color:#7c3aed;padding:6px 10px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.srow.hl{background:#f3e8ff;border-radius:10px}.srow.drag{background:#fff;box-shadow:0 4px 16px #7c3aed55;border-radius:10px;opacity:.95}.nm{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.av{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#f3e8ff center/cover;color:#7c3aed;font-weight:700;flex:none}.pk{display:inline-block;padding:10px 14px;border:2px dashed #c4b5fd;border-radius:12px;color:#7c3aed;font-weight:600;cursor:pointer}
</style></head><body>
<header>Mr:kzafey</header><main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');let token=localStorage.at;let M=null,G=null,T='att',DT=new Date().toISOString().slice(0,10),MO=DT.slice(0,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function mgApi(b){const r=await fetch('/api/mg',{method:b?'POST':'GET',headers:{Authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined});if(r.status==401||r.status==403){localStorage.removeItem('at');location='/';throw 0}const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function act(b){try{M=await mgApi(b);draw()}catch(e){alert(e&&e.message&&e.message.length<80?e.message:'حصل خطأ')}}
const grp=()=>M.groups.find(g=>g.id===G);
const api=(p,b)=>fetch('/api/'+p,{method:b?'POST':'GET',headers:{Authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
let AIS=null,adC=[],adD={top:[],posts:[],questions:[],secure:true},adL=[];
let _k=null,_arm=0,_rs=false,_first=null,_apply=null;
function navToast(m){let t=document.getElementById('navt');if(!t){t=document.createElement('div');t.id='navt';t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 18px;border-radius:20px;z-index:99;font-size:14px';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}
function navPush(key,st){if(_rs){_rs=false;_k=key;return}if(_k===null){history.replaceState({root:1},'');history.pushState(st,'');_k=key;_first=st;return}if(key!==_k){history.pushState(st,'');_k=key}}
window.addEventListener('popstate',e=>{const s=e.state;if(!s||s.root){if(_arm&&Date.now()-_arm<2500){_arm=0;history.back();return}_arm=Date.now();navToast('اضغط رجوع مرة تانية للخروج');if(_first){history.pushState(_first,'');_rs=true;_apply&&_apply(_first)}return}_arm=0;_rs=true;_apply&&_apply(s)});
let AD={me:'',list:[]},SH={};
async function loadAdm(){AD=await api('admins');SH=await api('admins/share');adC=await api('codes');if(adC.error){localStorage.removeItem('at');location='/';return}adD=await api('content');adL=await api('logs');AIS=await api('solve-admin');try{if(window.Android&&Android.setSecure)Android.setSecure(adD.secure!==false)}catch(e){}}
async function reload(){await loadAdm();draw()}
async function enter(v){V=v;if(['codes','pub','sec','qa','regs','adm','ai'].includes(v)){app.innerHTML='<div class=card>جاري التحميل...</div>';await loadAdm()}draw();scrollTo(0,0)}
const fd=t=>new Date(t).toLocaleString('en-GB');
async function loadThumbs(){for(const s of document.querySelectorAll('.thumbs')){for(let k=0;k<+s.dataset.n;k++){try{const r=await fetch('/api/top-image?id='+s.dataset.id+'&i='+k,{headers:{Authorization:'Bearer '+token}});if(!r.ok)continue;const im=document.createElement('img');im.src=URL.createObjectURL(await r.blob());im.style='width:90px;height:90px;object-fit:cover;margin:2px;border-radius:8px';s.appendChild(im)}catch(e){}}}}
function cp(t){const done=()=>{const m=$('#cpm');if(m){m.textContent='تم نسخ: '+t;setTimeout(()=>m.textContent='',2500)}};
 const fb=()=>{const x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(x);x.focus();x.select();try{document.execCommand('copy')}catch(e){}x.remove();done()};
 try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}}
async function mk(){const j=await api('codes',{count:$('#n').value,label:$('#lb').value,maxDevices:$('#md').value});await reload();const cs=Array.isArray(j)?j.map(c=>c.code):[];if(cs.length){$('#nc').innerHTML='<div style="background:#dcfce7;border-radius:10px;padding:10px;margin:8px 0"><b>تم إنشاء الكود:</b>'+cs.map(c=>`<div style="display:flex;gap:8px;align-items:center;margin:6px 0"><span class=num style="font-size:22px;font-weight:700;letter-spacing:2px;user-select:text;-webkit-user-select:text">${c}</span><button onclick="cp('${c}')">نسخ</button></div>`).join('')+(cs.length>1?`<button class=sec onclick="cp('${cs.join(' ')}')">نسخ الكل</button>`:'')+'<div id=cpm style="color:#166534;margin-top:4px"></div></div>'}}
async function tg(c){await api('codes/toggle',{code:c});reload()}
async function dl(p,k,v){if(confirm('متأكد؟')){await api(p,{[k]:v});reload()}}
async function ph(c){const r=await fetch('/api/student-photo?code='+c,{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const w=window.open();w.document.write('<img style="max-width:100%" src="'+URL.createObjectURL(await r.blob())+'">')}
const rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
const TO=(p,ms,what)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error(what+' أخد وقت طويل')),ms))]);
const rdE=f=>new Promise((res,rj)=>{const x=new FileReader;x.onload=()=>res(x.result);x.onerror=()=>rj(new Error('مقدرتش أقرا الملف'));x.readAsDataURL(f)});
async function shrink(f,max=1600){
 try{let w,h,src;
  if(window.createImageBitmap){const bm=await TO(createImageBitmap(f),20000,'فتح الصورة');w=bm.width;h=bm.height;src=bm}
  else{const u=URL.createObjectURL(f);src=await TO(new Promise((res,rj)=>{const i=new Image;i.onload=()=>res(i);i.onerror=()=>rj(new Error('decode'));i.src=u}),20000,'فتح الصورة');w=src.width;h=src.height}
  const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.85)}
 catch(e){ if(/^image\/(png|jpeg|webp)$/.test(f.type)&&f.size<9e6){return await TO(rdE(f),20000,'قراءة الصورة')} return null}}
const msg=(t,ok)=>{const m=$('#pm');if(m){m.style.cssText='padding:10px;border-radius:8px;margin:8px 0;background:'+(ok?'#dcfce7':'#fee2e2');m.textContent=t}};
async function post(){const fs=[...$('#pi').files];const t=$('#pt').value,x=$('#px').value,k=$('#pk').value;
 if(!fs.length&&!t&&!x)return msg('اختار صورة أو اكتب عنوان الأول');
 const b=$('#pb');if(b)b.disabled=true;const done=()=>{if(b)b.disabled=false};
 let images=[];try{for(let n=0;n<fs.length;n++){msg('جاري تجهيز الصورة '+(n+1)+' من '+fs.length+'...',1);const d=await shrink(fs[n]);if(d)images.push(d)}}catch(e){done();return msg('خطأ في تجهيز الصورة: '+e.message,0)}
 if(fs.length&&!images.length){done();return msg('الصورة مش مدعومة (غالبا HEIC). اختار صورة JPG أو PNG',0)}
 const body=JSON.stringify({kind:k,title:t,text:x,images});const mb=(body.length/1048576).toFixed(1);
 for(let tr=1;tr<=2;tr++){
  msg('جاري الرفع ('+mb+' MB)'+(tr>1?' - محاولة تانية':'')+'... السيرفر المجاني ممكن ياخد وقت لو كان نايم',1);
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),70000);
  try{const r=await fetch('/api/posts',{method:'POST',headers:{Authorization:'Bearer '+token},body,signal:ac.signal});clearTimeout(tm);const j=await r.json().catch(()=>({}));
   if(!r.ok||j.error){done();const e=j.error||('HTTP '+r.status);return msg('فشل النشر: '+(e=='admin only'||e=='login required'?'الجلسة انتهت، اخرج وادخل تاني':e=='bad_image'?'السيرفر رفض الصورة':e),0)}
   msg('تم الرفع، جاري التحديث...',1);try{await TO(reload(),15000,'تحديث الصفحة')}catch(e){}
   done();return msg('تم النشر ('+images.length+' صورة) ✅',1)}
  catch(e){clearTimeout(tm);if(tr==2){done();return msg('فشل الرفع: '+(e.name=='AbortError'?'انتهى الوقت (النت ضعيف أو السيرفر نايم). جرب تاني':e.message),0)}}}}
async function addq(){await api('questions',{subject:$('#qs').value,question:$('#qq').value,direct:$('#qd').value,explained:$('#qe').value});reload()}

const back=`<div class=card><button class=sec onclick="go('set')">← الإعدادات</button></div>`;
const regRows=q=>{const t=String(q||'').trim().toLowerCase();const L=adC.filter(c=>c.student&&(!t||(c.student.name+' '+c.student.phone+' '+c.code).toLowerCase().includes(t))).sort((a,b)=>(b.student.date||0)-(a.student.date||0));return L.length?L.map(c=>`<div class=row style="gap:10px"><div style="flex:1"><b>${esc(c.student.name)}</b><br><small class=num>${esc(c.student.phone)}</small></div><div class=num style="font-weight:700;user-select:text;letter-spacing:1px">${c.code}</div><button class=sec style="padding:4px 10px" onclick="cp('${c.code}')">نسخ</button></div>`).join(''):'<p><small>لا يوجد</small></p>'};
const vAi=()=>{const a=AIS||{cfg:{},defaults:{},today:{},days:[]},t=a.today||{},c=a.cfg||{},df=a.defaults||{};return back+`<div class=card><h3>حل المسائل: الحدود</h3><p>الحد اليومي لكل طالب (الافتراضي ${df.perStudent}). الصفر = الافتراضي.</p><input id=aiP type=number min=0 max=500 value="${c.perStudent||''}" placeholder="${df.perStudent}"><p>حد قراءة المسائل من الصورة يومياً لكل طالب (الافتراضي ${df.listLimit}).</p><input id=aiL type=number min=0 max=500 value="${c.listLimit||''}" placeholder="${df.listLimit}"><p>الحد العام اليومي للتطبيق كله (طلبات الذكاء الاصطناعي: حل + قراءة صورة). الصفر = بدون حد.</p><input id=aiG type=number min=0 max=100000 value="${c.globalCap||''}" placeholder="0"><button onclick="aiSave()">حفظ</button><div id=aim></div></div>
<div class=card><h3>الاستخدام اليوم</h3><p>طلبات الذكاء الاصطناعي: <b class=num>${t.ai||0}</b> حل + <b class=num>${t.det||0}</b> قراءة صورة</p><p>حلول من المخزن (من غير استهلاك): <b class=num>${t.hits||0}</b></p><p>طلبات فشلت: <b class=num>${t.fail||0}</b> (منها حصة جيميني خلصت: <b class=num>${t.quota||0}</b>)</p><p>حلول محفوظة في المخزن: <b class=num>${a.cacheSize||0}</b></p></div>
<div class=card><h3>آخر أيام</h3><table><tr><th>اليوم</th><th>حل</th><th>صورة</th><th>مخزن</th><th>فشل</th></tr>${(a.days||[]).map(d=>`<tr><td class=num>${d.d}</td><td class=num>${d.ai}</td><td class=num>${d.det}</td><td class=num>${d.hits}</td><td class=num>${d.fail}</td></tr>`).join('')}</table><p><small>اليوم بيتغير الساعة 3 الفجر بتوقيت مصر. الأرقام والمخزن بيتمسحوا مع كل تحديث للسيرفر المجاني.</small></p><button class=sec onclick="aiClear()">مسح مخزن الحلول</button></div>`};
async function aiSave(){const r=await api('solve-admin',{perStudent:$('#aiP').value,listLimit:$('#aiL').value,globalCap:$('#aiG').value});await loadAdm();draw();const m=$('#aim');if(m)m.innerHTML=r.ok?'<div class=warn style="background:#dcfce7;color:#166534">اتحفظ ✓</div>':'<div class=warn>حصلت مشكلة</div>'}
async function aiClear(){if(!confirm('تمسح كل الحلول المحفوظة في المخزن؟'))return;await api('solve-admin',{clearCache:true});await loadAdm();draw()}
const vRegs=()=>back+`<div class=card><h3>المسجلين بالتطبيق (${adC.filter(c=>c.student).length})</h3><input id=rq placeholder="ابحث بالاسم أو الرقم أو الكود" oninput="$('#rl').innerHTML=regRows(this.value)"><div id=rl>${regRows('')}</div></div>`;
const vAdm=()=>back+`<div class=card><h3>ربط البيانات</h3>${SH.linkedTo?`<p>بياناتك دلوقتي <b>مربوطة</b> مع بيانات <b class=num>${esc(SH.linkedTo)}</b> (بتشوف وتعدل نفس المجموعات والطلاب).</p><button class=sec onclick="if(confirm('فك الربط؟ هترجع لبياناتك الخاصة'))api('admins/unlink',{user:SH.me}).then(()=>init())">فك الربط عني</button>`:`<p>بياناتك <b>منفصلة</b> (مجموعات وطلاب ومصروف وغياب ودرجات خاصة بحسابك بس).</p>${(SH.members||[]).map(u=>`<div class=row><b class=num style="flex:1">${esc(u)} <small>مربوط ببياناتك</small></b><button class=sec onclick="api('admins/unlink',{user:'${esc(u)}'}).then(reload)">فك</button></div>`).join('')}${(SH.others||[]).filter(u=>!(SH.members||[]).includes(u)).map(u=>`<div class=row><b class=num style="flex:1">${esc(u)}</b><button onclick="if(confirm('المشرف ${esc(u)} هيشوف بياناتك ويعدل عليها بدل بياناته. متأكد؟'))api('admins/link',{user:'${esc(u)}'}).then(j=>{if(j.error)alert(j.error);else reload()})">يشوف بياناتي</button></div>`).join('')}`}<p><small>الأكواد والنشر والتسجيل بدون كود مشتركة بين كل المشرفين. المجموعات والطلاب والمصروف والغياب والدرجات هي اللي بتنفصل.</small></p></div><div class=card><h3>المشرفين</h3>${(AD.list||[]).map(a=>`<div class=row style="gap:10px"><div style="flex:1"><b class=num>${esc(a.user)}</b>${a.user.toLowerCase()==String(AD.me).toLowerCase()?' <small>(أنت)</small>':''}<br><small>${a.src=='env'?'حساب أساسي':esc(a.email||'مضاف من التطبيق')}</small></div>${a.src=='app'&&a.user!=AD.me?`<button class=red style="padding:4px 10px" onclick="if(confirm('حذف المشرف؟'))api('admins/delete',{username:'${esc(a.user)}'}).then(reload)">حذف</button>`:''}</div>`).join('')}</div><div class=card><h3>إضافة مشرف جديد</h3><input id=au placeholder="اسم المستخدم (إنجليزي)" style="direction:ltr" autocapitalize=off><input id=ae placeholder="الإيميل (اختياري، لربط Firebase بعدين)" style="direction:ltr" autocapitalize=off><input id=ap type=password placeholder="كلمة السر (8 حروف على الأقل)" style="direction:ltr"><button onclick="api('admins/add',{username:$('#au').value,email:$('#ae').value,password:$('#ap').value}).then(j=>{if(j.error)alert(j.error);else{alert('تمت الإضافة');reload()}})">إضافة</button><p><small>الحسابات المضافة هنا بتتمسح مع تحديث السيرفر المجاني. الحسابات الأساسية ثابتة.</small></p></div>`;
const vCodes=()=>back+`<div class=card><h3>التحكم في الدخول</h3><p>${adD.closed?'🔴 التطبيق مقفول للطلاب':'🟢 التطبيق شغال'}</p><button class="${adD.closed?'':'red'}" onclick="if(confirm('${adD.closed?'فتح':'قفل'} التطبيق عند كل الطلاب؟'))api('settings',{closed:${!adD.closed}}).then(reload)">${adD.closed?'فتح التطبيق':'قفل التطبيق عند الكل'}</button><p style="margin-top:12px">${adD.open?'🟢 التسجيل بدون كود شغال (كل واحد ياخد كود خاص بيه)':'⚪ التسجيل بدون كود مقفول'}</p><button class=sec onclick="api('settings',{open:${!adD.open}}).then(reload)">${adD.open?'إلغاء التسجيل بدون كود':'تفعيل التسجيل بدون كود'}</button></div><div class=card><h3>إنشاء أكواد</h3><div class=card><h3>إنشاء أكواد</h3><div id=nc></div><input id=n type=number value=1 min=1 max=200><input id=lb placeholder="ملاحظة (اختياري)"><input id=md type=number value=1 placeholder="عدد الأجهزة"><button onclick=mk()>إنشاء</button></div>
 <div class=card><h3>الأكواد والطلاب (${adC.length})</h3><table>${adC.map(c=>`<tr><td class=num><b style="user-select:text;-webkit-user-select:text;font-size:17px">${c.code}</b> <button class=sec style="padding:4px 10px" onclick="cp('${c.code}')">نسخ</button></td><td>${c.student?esc(c.student.name)+'<br><span class=num>'+esc(c.student.phone)+'</span>'+(c.student.hasPhoto?` <a href="#" onclick="ph('${c.code}');return false">صورة</a>`:''):'<small>لم يسجل بعد</small>'}</td><td>${c.devices.length}/${c.maxDevices}</td><td><button class=sec onclick="api('codes/endsession',{code:'${c.code}'}).then(()=>alert('تم إنهاء الجلسة'))">إنهاء الجلسة</button> <button class=sec onclick="tg('${c.code}')">${c.disabled?'تفعيل':'إيقاف'}</button> <button class=red onclick="dl('codes/delete','code','${c.code}')">حذف</button></td></tr>`).join('')}</table></div>
 `;
const vPub=()=>back+`<div class=card><h3>نشر</h3><select id=pk style="width:100%;padding:10px"><option value=top>صور الأوائل (محمية، من التطبيق فقط)</option><option value=news>إعلان عام</option></select><input id=pt placeholder="العنوان"><textarea id=px placeholder="نص"></textarea><input id=pi type=file accept="image/*" multiple><button id=pb onclick=post()>نشر لكل الطلاب</button><div id=pm></div>${adD.top.concat(adD.posts).map(p=>`<p>${p.kind=='top'?'🏆':'📢'} ${esc(p.title)} <small>(${p.count} صورة)</small> <button class=red onclick="dl('posts/delete','id','${p.id}')">حذف</button><br><span class=thumbs data-id="${p.id}" data-n="${p.count}" data-k="${p.kind}"></span></p>`).join('')}</div>
 `;
const vSec=()=>back+`<div class=card><h3>حماية الصور</h3><p>${adD.secure!==false?'الوضع الحالي: منع التصوير (السكرين شوت بيطلع أسود ومش بيتسجل)':'الوضع الحالي: تسجيل المحاولات (السكرين شوت مسموح وبيتسجل مين صوّر، أندرويد 14+)'}</p><button onclick="api('settings',{secure:${adD.secure===false}}).then(show)">${adD.secure!==false?'غيّر لوضع تسجيل المحاولات':'غيّر لوضع منع التصوير'}</button></div>
 <div class=card><h3>محاولات تصوير الشاشة (${adL.length})</h3>${adL.map(l=>`<p>${fd(l.date)}: ${esc(l.name||l.code)} <span class=num>${esc(l.phone||'')}</span> حاول يصور الشاشة${l.where=='top'?' في صور الأوائل':''}</p>`).join('')||'<p>لا يوجد</p>'}</div>
 `;
const vQa=()=>back+``;
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let V='home',SQ='',SAG=false,SAS=false,EG=false,EF=false,ES=null,HL=null;

 const k=Math.min(1,480/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);NP=c.toDataURL('image/jpeg',.75);NPR=false;const pv=document.getElementById('npv');if(pv){pv.style.backgroundImage='url('+NP+')';pv.textContent=''}}catch(e){alert('الصورة مش مدعومة، جرب JPG أو PNG')}}

 return `<div class=card><h3>حضور ${esc(c.name)}</h3><label>التاريخ</label><input type=date value="${DT}" onchange="DT=this.value||DT;draw()" style="direction:ltr"><div class=stat><span>✅ ${p}</span><span>❌ ${a}</span><span>غير مسجل ${c.students.length-p-a}</span></div>
 <div class=bt style="margin-bottom:8px"><button class=p onclick="act({op:'setAtt',gid:'${c.id}',date:'${DT}',sid:'*',status:'present'})">الكل حاضر</button><button class=a onclick="act({op:'setAtt',gid:'${c.id}',date:'${DT}',sid:'*',status:'absent'})">الكل غائب</button><button onclick="act({op:'setAtt',gid:'${c.id}',date:'${DT}',sid:'*',status:''})">مسح الكل</button></div>`+
 (c.students.map(s=>`<div class=row>${av(s)}<b>${esc(s.name)}</b><div class=bt><button class="${A[s.id]=='present'?'p':''}" onclick="act({op:'setAtt',gid:'${c.id}',date:'${DT}',sid:'${s.id}',status:'present'})">حاضر</button><button class="${A[s.id]=='absent'?'a':''}" onclick="act({op:'setAtt',gid:'${c.id}',date:'${DT}',sid:'${s.id}',status:'absent'})">غائب</button><button onclick="act({op:'setAtt',gid:'${c.id}',date:'${DT}',sid:'${s.id}',status:''})">مسح</button></div></div>`).join('')||'<p>أضف طلاب من تبويب "الطلاب".</p>')+'</div>'}
function payV(c){const P=M.pay[c.id+'|'+MO]||{},n=c.students.filter(s=>P[s.id]).length,fee=+c.fee||0,td=ld(new Date());
 return `<div class=card><h3>مصروفات ${esc(c.name)}</h3><label>الشهر</label><input type=month value="${MO}" onchange="MO=this.value||MO;draw()" style="direction:ltr"><p><small>المصروف الشهري: <span class=num>${fee}</span> جنيه (التعديل من الإعدادات)</small></p>
 <div class=stat><span>دفع: ${n}</span><span>لم يدفع: ${c.students.length-n}</span><span>المحصّل: ${n*fee}</span><span>المتبقي: ${(c.students.length-n)*fee}</span></div>`+
 (c.students.map(s=>`<div class=row>${av(s)}<div style="flex:1"><b>${esc(s.name)}</b>${P[s.id]?`<br><small>دفع بتاريخ <span class=num>${esc(P[s.id])}</span></small>`:''}</div><div class=bt>${P[s.id]?`<button class=p>✅ دفع</button><button onclick="act({op:'setPay',gid:'${c.id}',month:'${MO}',sid:'${s.id}',paid:false})">مسح</button>`:`<button class=p onclick="act({op:'setPay',gid:'${c.id}',month:'${MO}',sid:'${s.id}',paid:true,date:'${td}'})">دفع</button>`}</div></div>`).join('')||'<p>لا يوجد طلاب.</p>')+'</div>'}
function phone(p){p=String(p||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p='20'+p.slice(1);return p}
function report(c,s,mo){const dates=Object.keys(M.att).filter(k=>k.startsWith(c.id+'|'+mo)).map(k=>k.split('|')[1]).sort();let pr=0,ab=0;dates.forEach(d=>{const x=M.att[c.id+'|'+d][s.id];if(x=='present')pr++;if(x=='absent')ab++});
 const pd=(M.pay[c.id+'|'+mo]||{})[s.id];
 return `📊 *تقرير الطالب:* ${s.name}\n📚 *المجموعة:* ${c.name}\n📅 *تقرير شهر:* ${mo}\n------------------\n✅ *الحضور:* ${pr} من أصل ${dates.length} حصص\n❌ *الغياب:* ${ab}\n💰 *مصروف الشهر:* ${pd?'تم الدفع ✅ ('+pd+')':'لم يتم الدفع بعد ⚠️'}`}
function repV(c){return `<div class=card><h3>تقرير شهري لولي الأمر</h3><label>الشهر</label><input type=month value="${MO}" onchange="MO=this.value||MO;draw()" style="direction:ltr"><p><small>الزر يفتح واتساب برسالة جاهزة لرقم الطالب، وتدوس إرسال هناك.</small></p>`+
 (c.students.map(s=>`<div class=row><div style="flex:1"><b>${esc(s.name)}</b><br><small class=num>${esc(s.phone||'بدون رقم')}</small></div><div class=bt><button class=wa ${phone(s.phone).length<8?'disabled':''} onclick="sendR('${s.id}')">إرسال</button></div></div>`).join('')||'<p>لا يوجد طلاب.</p>')+'</div>'}
function sendR(sid){const c=grp(),s=c.students.find(x=>x.id===sid);const ph=phone(s.phone);if(ph.length<8)return alert('رقم الهاتف ناقص');window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(report(c,s,MO)),'_blank')}
function stuV(c){
 const add=SAS?`<div class=card><h3>طالب جديد</h3><input id=sn placeholder="اسم الطالب"><input id=sp placeholder="رقم الهاتف (واتساب ولي الأمر)" style="direction:ltr" inputmode=tel>${photoPick(null)}<button onclick="act({op:'addStudent',gid:'${c.id}',name:$('#sn').value,phone:$('#sp').value,photo:NP});SAS=false;NP=null">حفظ</button> <button class=sec onclick="SAS=false;draw()">إلغاء</button><hr style="border:0;border-top:1px solid #eee"><button class=sec onclick="act({op:'fromCodes',gid:'${c.id}'});SAS=false">إضافة الطلاب المسجلين بالأكواد</button></div>`:`<div class=card><button class=big style="margin:0" onclick="SAS=true;draw()">+ إضافة طالب</button></div>`;
 const rows=c.students.map(s=>ES===s.id?`<div class=card id="st_${s.id}" style="border:2px solid #7c3aed"><h3>تعديل الطالب</h3><input id=esn value="${esc(s.name)}"><input id=esp value="${esc(s.phone||'')}" style="direction:ltr" inputmode=tel>${photoPick(s)}${linkBox(c,s)}<div style="background:#f3e8ff;border-radius:12px;padding:10px;margin:8px 0"><b>نقل لمجموعة تانية</b><small style="display:block;color:#64748b">الدفع والغياب والدرجات بتتنقل معاه</small><select id=mvg>${M.groups.filter(x=>x.id!==c.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button onclick="if($('#mvg').value&&confirm('نقل الطالب؟')){ES=null;G=$('#mvg').value;act({op:'moveStudent',gid:'${c.id}',sid:'${s.id}',to:$('#mvg').value})}">نقل</button></div><button onclick="act({op:'editStudent',gid:'${c.id}',sid:'${s.id}',name:$('#esn').value,phone:$('#esp').value,photo:NP,rmPhoto:NPR});ES=null;NP=null;NPR=false">حفظ</button> <button class=sec onclick="ES=null;draw()">إلغاء</button> <button class=red onclick="if(confirm('حذف الطالب؟')){ES=null;act({op:'delStudent',gid:'${c.id}',sid:'${s.id}'})}">حذف</button></div>`:`<div class="row srow ${HL===s.id?'hl':''}" id="st_${s.id}" data-id="${s.id}"><span class=hd data-h=1>☰</span>${av(s)}<div class=nm style="flex:1"><b>${esc(s.name)}</b><br><small class=num>${esc(s.phone||'')}${s.code?' 🔗':''}</small></div><div class=bt><button onclick="SID='${s.id}';go('stg')">درجات</button><button onclick="ES='${s.id}';draw()">تعديل</button></div></div>`).join('');
 return add+`<div class=card><h3>طلاب ${esc(c.name)} (${c.students.length})</h3><small>اسحب ☰ أو اضغط مطولاً على الاسم لتغيير الترتيب</small><div id=sl>${rows||'<p>لا يوجد طلاب.</p>'}</div></div><div class=card><button class=red onclick="if(confirm('حذف المجموعة بكل سجلاتها؟'))act({op:'delGroup',gid:'${c.id}'})">حذف المجموعة</button></div>`}

(function(){let row=null,timer=null,sy=0;const list=()=>document.getElementById('sl');
 function mv(y){const l=list();if(!l||!row)return;const rs=[...l.querySelectorAll('.srow')];for(const r of rs){if(r===row)continue;const b=r.getBoundingClientRect();if(y>b.top&&y<b.bottom){const mid=b.top+b.height/2;if(y<mid)l.insertBefore(row,r);else l.insertBefore(row,r.nextSibling);break}}}
 function start(r){row=r;r.classList.add('drag');if(navigator.vibrate)try{navigator.vibrate(20)}catch(e){}}
 async function end(){if(!row)return;const l=list(),r=row;row=null;r.classList.remove('drag');clearTimeout(timer);const order=[...l.querySelectorAll('.srow')].map(x=>x.dataset.id);act({op:'reorder',gid:G,order})}
 document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('[data-h]');if(h){const r=h.closest('.srow');if(r){e.preventDefault();start(r);try{h.setPointerCapture(e.pointerId)}catch(x){}}}});
 document.addEventListener('pointermove',e=>{if(row)mv(e.clientY)});
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
 // long press on name (touch + mouse)
 document.addEventListener('touchstart',e=>{const n=e.target.closest&&e.target.closest('.nm');if(!n)return;const r=n.closest('.srow');sy=e.touches[0].clientY;clearTimeout(timer);timer=setTimeout(()=>start(r),380)},{passive:true});
 document.addEventListener('touchmove',e=>{if(row){e.preventDefault();mv(e.touches[0].clientY)}else{clearTimeout(timer)}},{passive:false});
 document.addEventListener('touchend',()=>{clearTimeout(timer);end()});
 document.addEventListener('mousedown',e=>{if(e.pointerType)return;const n=e.target.closest&&e.target.closest('.nm');if(!n)return;const r=n.closest('.srow');clearTimeout(timer);timer=setTimeout(()=>start(r),380)});
 document.addEventListener('mousemove',e=>{if(row)mv(e.clientY)});document.addEventListener('mouseup',()=>{clearTimeout(timer);end()});
})();
init().catch(e=>{if(e)app.textContent='خطأ: '+e.message});
</script></body></html>
